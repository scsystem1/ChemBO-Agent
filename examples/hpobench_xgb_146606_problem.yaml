problem:
  application_domain: hpo
  domain_profile: ml_hyperparameter_optimization
  description: |
    Optimize HPOBench XGBoost test accuracy on OpenML task 146606.
    The optimization key uses the XGBoost hyperparameter grid plus n_estimators fidelity.
    The CSV aggregates repeated seeds and keeps the constant subsample column as metadata.
  reaction_type: HPOBENCH_XGB
  target_metric: test_acc
  optimization_direction: maximize
  budget: 40
  hpo_benchmark:
    source: HPOBench
    model: xgb
    task_id: 146606
    dataset_name: openml_146606
    metric: test_acc
    hp_space: 4D + n_estimators fidelity
    grid: "36000 configs"
    data_summary: "5-seed aggregated tabular benchmark"
    config_columns: [colsample_bytree, eta, max_depth, reg_lambda]
    fidelity_columns: [n_estimators]
  variables:
    - {name: colsample_bytree, role: hyperparameter, type: categorical, domain: [], description: "XGBoost column subsampling grid level."}
    - {name: eta, role: hyperparameter, type: categorical, domain: [], description: "XGBoost learning rate grid level, log-scaled in the benchmark."}
    - {name: max_depth, role: hyperparameter, type: categorical, domain: [], description: "XGBoost maximum tree depth integer grid level."}
    - {name: reg_lambda, role: hyperparameter, type: categorical, domain: [], description: "XGBoost L2 regularization grid level, log-scaled in the benchmark."}
    - {name: n_estimators, role: fidelity, type: categorical, domain: [], description: "XGBoost number of boosting rounds fidelity grid level."}
  constraints:
    - "Only propose configurations that correspond to rows present in the HPOBench xgb task 146606 dataset."
    - "Treat n_estimators as part of the legal tabular configuration key."
  dataset:
    csv_path: ../data/HPOBench/hpobench_xgb_146606.csv
    feature_columns: [colsample_bytree, eta, max_depth, reg_lambda, n_estimators]
    target_column: test_acc
    row_id_column: row_id
  initial_data: []

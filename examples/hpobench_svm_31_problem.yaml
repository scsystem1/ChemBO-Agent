problem:
  application_domain: hpo
  domain_profile: ml_hyperparameter_optimization
  description: |
    Optimize HPOBench SVM validation accuracy on the credit-g OpenML task 31.
    The configuration space follows the intended 2D grid over C and gamma,
    with dataset_fraction treated as the fidelity column.
  reaction_type: HPOBENCH_SVM
  target_metric: val_acc
  optimization_direction: maximize
  budget: 40
  hpo_benchmark:
    source: HPOBench
    model: svm
    task_id: 31
    dataset_name: credit-g
    metric: val_acc
    hp_space: 2D
    grid: "441 configs (21x21)"
    data_summary: "1000x20, binary"
    config_columns: [C, gamma]
    fidelity_columns: [dataset_fraction]
  variables:
    - name: C
      role: hyperparameter
      type: categorical
      domain: []
      description: "SVM regularization strength; intended grid C in [2^-10, 2^10]."
    - name: gamma
      role: hyperparameter
      type: categorical
      domain: []
      description: "SVM kernel gamma; intended grid gamma in [2^-10, 2^10]."
    - name: dataset_fraction
      role: fidelity
      type: categorical
      domain: []
      description: "Training data fraction fidelity grid level."
  constraints:
    - "Only propose configurations that correspond to rows present in the HPOBench svm credit-g task 31 dataset."
    - "Treat dataset_fraction as part of the legal tabular configuration key."
  dataset:
    csv_path: ../data/HPOBench/hpobench_svm_31.csv
    feature_columns: [C, gamma, dataset_fraction]
    target_column: val_acc
    row_id_column: row_id
  initial_data: []

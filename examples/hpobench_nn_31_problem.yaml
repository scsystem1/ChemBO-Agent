problem:
  application_domain: hpo
  domain_profile: ml_hyperparameter_optimization
  description: |
    Optimize HPOBench neural network validation accuracy on the credit-g OpenML task 31.
    The optimization key uses the intended 5D hyperparameter grid.
  reaction_type: HPOBENCH_NN
  target_metric: val_acc
  optimization_direction: maximize
  budget: 40
  hpo_benchmark:
    source: HPOBench
    model: nn
    task_id: 31
    dataset_name: credit-g
    metric: val_acc
    hp_space: 5D
    grid: "30000 configs"
    data_summary: "1000x20, binary"
    config_columns: [alpha, batch_size, depth, learning_rate_init, width]
    fidelity_columns: []
  variables:
    - {name: alpha, role: hyperparameter, type: categorical, domain: [], description: "Neural network regularization strength grid level, log-scaled in the benchmark."}
    - {name: batch_size, role: hyperparameter, type: categorical, domain: [], description: "Neural network batch size grid level, log-scaled in the benchmark."}
    - {name: depth, role: hyperparameter, type: categorical, domain: [], description: "Neural network depth grid level."}
    - {name: learning_rate_init, role: hyperparameter, type: categorical, domain: [], description: "Neural network initial learning rate grid level, log-scaled in the benchmark."}
    - {name: width, role: hyperparameter, type: categorical, domain: [], description: "Neural network hidden width grid level."}
  constraints:
    - "Only propose configurations that correspond to rows present in the HPOBench nn credit-g task 31 dataset."
    - "If the raw HPOBench table contains fidelity columns, use the max-fidelity projection generated by scripts/build_hpobench_tabular.py."
  dataset:
    csv_path: ../data/HPOBench/hpobench_nn_31.csv
    feature_columns: [alpha, batch_size, depth, learning_rate_init, width]
    target_column: val_acc
    row_id_column: row_id
  initial_data: []

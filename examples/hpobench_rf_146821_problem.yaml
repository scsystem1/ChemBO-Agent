problem:
  application_domain: hpo
  domain_profile: ml_hyperparameter_optimization
  description: |
    Optimize HPOBench Random Forest validation accuracy on the car OpenML task 146821.
    The optimization key uses the intended 4D hyperparameter grid.
  reaction_type: HPOBENCH_RF
  target_metric: val_acc
  optimization_direction: maximize
  budget: 40
  hpo_benchmark:
    source: HPOBench
    model: rf
    task_id: 146821
    dataset_name: car
    metric: val_acc
    hp_space: 4D
    grid: "10000 configs"
    data_summary: "1728x6, 4-class"
    config_columns: [max_depth, max_features, min_samples_leaf, min_samples_split]
    fidelity_columns: []
  variables:
    - {name: max_depth, role: hyperparameter, type: categorical, domain: [], description: "Random Forest maximum tree depth grid level."}
    - {name: max_features, role: hyperparameter, type: categorical, domain: [], description: "Random Forest feature subsampling grid level."}
    - {name: min_samples_leaf, role: hyperparameter, type: categorical, domain: [], description: "Random Forest minimum samples per leaf grid level."}
    - {name: min_samples_split, role: hyperparameter, type: categorical, domain: [], description: "Random Forest minimum samples per split grid level."}
  constraints:
    - "Only propose configurations that correspond to rows present in the HPOBench rf car task 146821 dataset."
    - "If the raw HPOBench table contains fidelity columns, use the max-fidelity projection generated by scripts/build_hpobench_tabular.py."
  dataset:
    csv_path: ../data/HPOBench/hpobench_rf_146821.csv
    feature_columns: [max_depth, max_features, min_samples_leaf, min_samples_split]
    target_column: val_acc
    row_id_column: row_id
  initial_data: []

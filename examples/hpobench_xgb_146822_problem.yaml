problem:
  application_domain: hpo
  domain_profile: ml_hyperparameter_optimization
  description: |
    Optimize HPOBench XGBoost validation accuracy on the segment OpenML task 146822.
    The optimization key uses the intended 4D hyperparameter grid.
  reaction_type: HPOBENCH_XGB
  target_metric: val_acc
  optimization_direction: maximize
  budget: 40
  hpo_benchmark:
    source: HPOBench
    model: xgb
    task_id: 146822
    dataset_name: segment
    metric: val_acc
    hp_space: 4D
    grid: "10000 configs"
    data_summary: "2310x19, 7-class"
    config_columns: [colsample_bytree, eta, max_depth, reg_lambda]
    fidelity_columns: []
  variables:
    - {name: colsample_bytree, role: hyperparameter, type: categorical, domain: [], description: "XGBoost column subsampling grid level."}
    - {name: eta, role: hyperparameter, type: categorical, domain: [], description: "XGBoost learning rate grid level, log-scaled in the benchmark."}
    - {name: max_depth, role: hyperparameter, type: categorical, domain: [], description: "XGBoost maximum tree depth integer grid level."}
    - {name: reg_lambda, role: hyperparameter, type: categorical, domain: [], description: "XGBoost L2 regularization grid level, log-scaled in the benchmark."}
  constraints:
    - "Only propose configurations that correspond to rows present in the HPOBench xgb segment task 146822 dataset."
    - "If the raw HPOBench table contains fidelity columns, use the max-fidelity projection generated by scripts/build_hpobench_tabular.py."
  dataset:
    csv_path: ../data/HPOBench/hpobench_xgb_146822.csv
    feature_columns: [colsample_bytree, eta, max_depth, reg_lambda]
    target_column: val_acc
    row_id_column: row_id
  initial_data: []

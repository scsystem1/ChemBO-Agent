problem:
  application_domain: hpo
  domain_profile: ml_hyperparameter_optimization
  description: |
    Optimize HPOBench Random Forest test accuracy on OpenML task 146606.
    The optimization key uses the Random Forest hyperparameter grid plus n_estimators fidelity.
    The CSV aggregates repeated seeds and keeps the constant subsample column as metadata.
  reaction_type: HPOBENCH_RF
  target_metric: test_acc
  optimization_direction: maximize
  budget: 40
  hpo_benchmark:
    source: HPOBench
    model: rf
    task_id: 146606
    dataset_name: openml_146606
    metric: test_acc
    hp_space: 4D + n_estimators fidelity
    grid: "36000 configs"
    data_summary: "5-seed aggregated tabular benchmark"
    config_columns: [max_depth, max_features, min_samples_leaf, min_samples_split]
    fidelity_columns: [n_estimators]
  variables:
    - {name: max_depth, role: hyperparameter, type: categorical, domain: [], description: "Random Forest maximum tree depth grid level."}
    - {name: max_features, role: hyperparameter, type: categorical, domain: [], description: "Random Forest feature subsampling grid level."}
    - {name: min_samples_leaf, role: hyperparameter, type: categorical, domain: [], description: "Random Forest minimum samples per leaf grid level."}
    - {name: min_samples_split, role: hyperparameter, type: categorical, domain: [], description: "Random Forest minimum samples per split grid level."}
    - {name: n_estimators, role: fidelity, type: categorical, domain: [], description: "Random Forest number of trees fidelity grid level."}
  constraints:
    - "Only propose configurations that correspond to rows present in the HPOBench rf task 146606 dataset."
    - "Treat n_estimators as part of the legal tabular configuration key."
  dataset:
    csv_path: ../data/HPOBench/hpobench_rf_146606.csv
    feature_columns: [max_depth, max_features, min_samples_leaf, min_samples_split, n_estimators]
    target_column: test_acc
    row_id_column: row_id
  initial_data: []

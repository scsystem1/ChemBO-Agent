# ChemBO Agent - Pfizer/Perera Suzuki Benchmark
# =============================================

problem:
  description: |
    Optimize the product yield of a dataset-backed Suzuki-Miyaura benchmark. 
    Public descriptions of this benchmark indicate a Pd(OAc)2-mediated quinoline /
    indazole coupling manifold screened at 100 degC with a 1 min residence
    time, while ligand, base, solvent, and the exact substrate-handle pairing
    are varied across the dataset.

    The search space is restricted to the experimentally observed rows present
    in the vendored CSV. During simulation, the optimizer should not see the
    Product_Yield_PCT_Area_UV column; outcomes are revealed only via the
    dataset oracle at the human-interrupt step.

  reaction_type: Suzuki
  target_metric: Product yield (% area UV)
  optimization_direction: maximize
  budget: 40

  reaction:
    family: Suzuki-Miyaura cross-coupling
    reaction_smiles: ""
    substrates:
      - role: other
        name: "quinoline-derived coupling partner manifold"
      - role: other
        name: "indazole-derived coupling partner manifold"
    product_smiles: ""
    known_fixed_context:
      - role: catalyst_precursor
        value: "Pd(OAc)2"
      - role: temperature
        value: "100 degC"
      - role: contact_time
        value: "1 min"
      - role: other
        value: "Benchmark product manifold couples quinoline and indazole cores."
      - role: other
        value: "Substrate handles vary by row, so electrophile / boron-partner identity is dataset-specific."

  retrieval:
    goals: [precedent, mechanism, property]
    must_match_roles: [reaction_family, ligand, base, solvent]
    prefer_sources: [ord, reviews, textbooks]
    query_mode: optimize_conditions

  variables:
    - name: Reactant_1_Name
      role: other
      type: categorical
      domain:
        - "6-Bromoquinoline"
        - "6-Iodoquinoline"
        - "6-Quinolineboronic acid pinacol ester"
        - "6-chloroquinoline"
        - "6-quinoline-boronic acid hydrochloride"
        - "6-triflatequinoline"
        - "Potassium quinoline-6-trifluoroborate"
      description: "Dataset-specific quinoline-side substrate label. Depending on the row, this entry can be an electrophile or an organoboron partner."
      descriptor:
        enabled: true
        entity_kind: substrate
        resolver: dataset_value_map
        max_selected_descriptors: 3
        candidate_pools: [rdkit_2d, rdkit_substructure_counts, cross_coupling_substrate_physchem]
        available_descriptors:
          rdkit_2d:
            - MolWt
            - MolLogP
            - TPSA
            - HeavyAtomCount
            - RingCount
            - NumAromaticRings
            - BertzCT
          rdkit_substructure_counts:
            - aryl_halide_count
            - aryl_bromide_count
            - aryl_chloride_count
            - aryl_iodide_count
            - boronic_acid_group_count
            - boronate_ester_group_count
            - trifluoroborate_group_count
          cross_coupling_substrate_physchem:
            - leaving_group_conjugate_acid_pKa_water
        validation:
          coverage: strict_non_absent
          collision: fail_on_selected_descriptor_collision
          allow_semichemical_ordinal: true

    - name: Reactant_2_Name
      role: other
      type: categorical
      domain:
        - "Boronic Acid"
        - "Boronic Ester"
        - "Bromide"
        - "Trifluoroborate"
      description: "Dataset-specific indazole-side coupling-handle class. Legal values depend on Reactant_1_Name and are constrained by the dataset rows."
      descriptor:
        enabled: true
        entity_kind: coupling_handle
        resolver: dataset_value_map
        max_selected_descriptors: 3
        candidate_pools: [rdkit_2d, rdkit_substructure_counts, cross_coupling_substrate_physchem]
        available_descriptors:
          rdkit_2d:
            - MolWt
            - MolLogP
            - TPSA
            - HeavyAtomCount
            - RingCount
          rdkit_substructure_counts:
            - aryl_halide_count
            - aryl_bromide_count
            - boronic_acid_group_count
            - boronate_ester_group_count
            - trifluoroborate_group_count
          cross_coupling_substrate_physchem:
            - leaving_group_conjugate_acid_pKa_water
        validation:
          coverage: strict_non_absent
          collision: fail_on_selected_descriptor_collision
          allow_semichemical_ordinal: true

    - name: Ligand_Short_Hand
      role: ligand
      type: categorical
      domain:
        - "AmPhos"
        - "CataCXium A"
        - "None"
        - "P(Cy)3"
        - "P(Ph)3"
        - "P(o-Tol)3"
        - "P(tBu)3"
        - "SPhos"
        - "XPhos"
        - "Xantphos"
        - "dppf"
        - "dtbpf"
      description: "Ligand shorthand exactly as encoded in the benchmark CSV."
      descriptor:
        enabled: true
        entity_kind: ligand
        resolver: dataset_value_map
        allow_absent_values: ["None"]
        max_selected_descriptors: 3
        candidate_pools: [rdkit_2d, rdkit_substructure_counts]
        available_descriptors:
          rdkit_2d:
            - MolWt
            - MolLogP
            - TPSA
            - NumRotatableBonds
            - RingCount
            - FractionCSP3
            - BertzCT
          rdkit_substructure_counts:
            - phosphine_donor_count
        validation:
          coverage: strict_non_absent
          collision: fail_on_selected_descriptor_collision
          allow_semichemical_ordinal: false

    - name: Reagent_1_Short_Hand
      role: base
      type: categorical
      domain:
        - "CsF"
        - "Et3N"
        - "K3PO4"
        - "KOH"
        - "LiOtBu"
        - "NaHCO3"
        - "NaOH"
        - "None"
      description: "Base or activating reagent shorthand exactly as encoded in the benchmark CSV."
      descriptor:
        enabled: true
        entity_kind: base
        resolver: dataset_value_map
        allow_absent_values: ["None"]
        max_selected_descriptors: 3
        candidate_pools: [rdkit_2d, base_reagent_physchem]
        available_descriptors:
          rdkit_2d:
            - MolWt
            - ExactMolWt
            - TPSA
            - FormalCharge
            - NumHAcceptors
            - NumHDonors
          base_reagent_physchem:
            - formula_weight_g_mol
            - pKa_conjugate_acid_water
            - cation_charge
            - anion_charge
            - cation_radius_shannon_cn6_A
        validation:
          coverage: strict_non_absent
          collision: fail_on_selected_descriptor_collision
          allow_semichemical_ordinal: false

    - name: Solvent_1_Short_Hand
      role: solvent
      type: categorical
      domain:
        - "DMF"
        - "MeCN"
        - "MeOH"
        - "MeOH/H2O_V2 9:1"
        - "THF"
        - "THF_V2"
      description: "Solvent label exactly as encoded in the benchmark CSV. Note that only dataset-observed substrate/solvent combinations are legal."
      descriptor:
        enabled: true
        entity_kind: solvent
        resolver: dataset_value_map
        max_selected_descriptors: 3
        candidate_pools: [rdkit_2d, solvent_physchem]
        available_descriptors:
          rdkit_2d:
            - MolWt
            - MolLogP
            - TPSA
            - NumHAcceptors
            - NumHDonors
          solvent_physchem:
            - dielectric_constant_25C
            - dipole_moment_D
            - donor_number_kcal_mol
            - acceptor_number
            - ET30_kcal_mol
            - normalized_Reichardt_ETN
            - boiling_point_C
            - density_g_mL_20C
            - viscosity_cP_25C
            - water_volume_fraction
        validation:
          coverage: strict_non_absent
          collision: warn_if_rdkit_only_collision
          allow_semichemical_ordinal: false

  constraints:
    - "Only propose conditions that correspond to rows present in the suzuki.csv dataset."
    - "Reactant_1_Name and Reactant_2_Name are not a free cartesian pair; only the observed substrate-pair manifolds in the dataset are legal."
    - "Respect the fixed Pd(OAc)2 / 100 degC / 1 min benchmark context reported for this nanomole-scale flow-screening dataset."

  dataset:
    csv_path: ../data/suzuki.csv
    feature_columns:
      - Reactant_1_Name
      - Reactant_2_Name
      - Ligand_Short_Hand
      - Reagent_1_Short_Hand
      - Solvent_1_Short_Hand
    target_column: Product_Yield_PCT_Area_UV
    row_id_column: ""

  initial_data: []

# ChemBO Agent — Dataset-Backed DAR Benchmark
# ===========================================

problem:
  description: |
    Optimize the yield of a Direct Arylation Reaction (DAR) benchmark using the
    vendored DAR dataset. The search space is restricted to the experimentally
    observed conditions present in the CSV. During simulation, the optimizer
    should not see the yield column; yields are revealed only via the dataset
    oracle at the human-interrupt step.

  reaction_type: DAR
  target_metric: yield
  optimization_direction: maximize
  budget: 40

  reaction:
    family: DAR
    canonical_name: Direct Arylation Reaction
    aliases:
      - direct arylation
      - c-h arylation
      - c-h activation
    reaction_smiles: ""
    substrates:
      - role: c_h_partner
        name: "1-methyl-1H-imidazole-4-carbonitrile"
      - role: aryl_halide
        name: "1-bromo-2-fluorobenzene"
    product_smiles: ""
    known_fixed_context:
      - role: catalyst_precursor
        value: "Pd(OAc)2"
      - role: benchmark_substrates
        value: "Direct Arylation of 1-methyl-1H-imidazole-4-carbonitrile with 1-bromo-2-fluorobenzene"

  retrieval:
    goals: [precedent, mechanism, property]
    must_match_roles: [reaction_family, ligand, base]
    prefer_sources: [ord, reviews, textbooks]
    query_mode: optimize_conditions

  variables:
    - name: base_SMILES
      role: base
      type: categorical
      domain:
        - "O=C([O-])C(C)(C)C.[Cs+]"
        - "O=C([O-])C(C)(C)C.[K+]"
        - "O=C([O-])C.[Cs+]"
        - "O=C([O-])C.[K+]"
      description: "Base encoded as a raw SMILES string present in the dataset"
      descriptor:
        enabled: true
        entity_kind: base
        resolver: smiles_direct
        max_selected_descriptors: 5
        candidate_pools: [rdkit_2d, base_reagent_physchem]
        available_descriptors:
          rdkit_2d:
            - MolWt
            - ExactMolWt
            - TPSA
            - FormalCharge
            - NumHAcceptors
            - NumHDonors
            - HeavyAtomCount
          base_reagent_physchem:
            - formula_weight_g_mol
            - pKa_conjugate_acid_water
            - cation_charge
            - cation_radius_shannon_cn6_A
            - aqueous_solubility_mol_L_25C
        validation:
          coverage: strict_non_absent
          collision: fail_on_selected_descriptor_collision
          allow_semichemical_ordinal: false

    - name: ligand_SMILES
      role: ligand
      type: categorical
      domain:
        - "CC(C)(C)P(C1=CC=CC=C1)C(C)(C)C"
        - "CC(C)C1=CC(C(C)C)=C(C(C(C)C)=C1)C2=C(P(C3CCCCC3)C4CCCCC4)C(OC)=CC=C2OC"
        - "CC(C1=C(C2=CC=CC=C2P(C3CCCCC3)C4CCCCC4)C(C(C)C)=CC(C(C)C)=C1)C"
        - "CC(OC1=C(P(C2CCCCC2)C3CCCCC3)C(OC(C)C)=CC=C1)C"
        - "CN(C)C1=CC=CC(N(C)C)=C1C2=CC=CC=C2P(C(C)(C)C)C3=CC=CC=C3"
        - "CP(C)C1=CC=CC=C1"
        - "CP(C1=CC=CC=C1)C2=CC=CC=C2"
        - "C[C@]1(O2)O[C@](C[C@]2(C)P3C4=CC=CC=C4)(C)O[C@]3(C)C1"
        - "FC(F)(F)C1=CC(P(C2=C(C3=C(C(C)C)C=C(C(C)C)C=C3C(C)C)C(OC)=CC=C2OC)C4=CC(C(F)(F)F)=CC(C(F)(F)F)=C4)=CC(C(F)(F)F)=C1"
        - "P(C1=CC=CC=C1)(C2=CC=CC=C2)C3=CC=CC=C3"
        - "P(C1=CC=CO1)(C2=CC=CO2)C3=CC=CO3"
        - "P(C1CCCCC1)(C2CCCCC2)C3CCCCC3"
      description: "Ligand encoded as a raw SMILES string present in the dataset"
      descriptor:
        enabled: true
        entity_kind: ligand
        resolver: smiles_direct
        max_selected_descriptors: 5
        candidate_pools: [rdkit_2d, rdkit_substructure_counts, ligand_physchem]
        available_descriptors:
          rdkit_2d:
            - MolWt
            - MolLogP
            - TPSA
            - NumRotatableBonds
            - RingCount
            - NumAromaticRings
            - FractionCSP3
            - BertzCT
          rdkit_substructure_counts:
            - phosphine_donor_count
          ligand_physchem:
            - TEP_cm_minus_1
            - percent_Vbur
            - tolman_cone_angle_deg
            - solid_angle_sr
            - sterimol_L_A
            - sterimol_B1_A
            - sterimol_B5_A
        validation:
          coverage: strict_non_absent
          collision: fail_on_selected_descriptor_collision
          allow_semichemical_ordinal: false

    - name: solvent_SMILES
      role: solvent
      type: categorical
      domain:
        - "CC(N(C)C)=O"
        - "CC1=CC=C(C)C=C1"
        - "CCCC#N"
        - "CCCCOC(C)=O"
      description: "Solvent encoded as a raw SMILES string present in the dataset"
      descriptor:
        enabled: true
        entity_kind: solvent
        resolver: smiles_direct
        max_selected_descriptors: 5
        candidate_pools: [rdkit_2d, solvent_physchem]
        available_descriptors:
          rdkit_2d:
            - MolWt
            - MolLogP
            - TPSA
            - NumHAcceptors
            - NumHDonors
          solvent_physchem:
            - dielectric_constant_25C
            - dipole_moment_D
            - donor_number_kcal_mol
            - acceptor_number
            - ET30_kcal_mol
            - normalized_Reichardt_ETN
            - boiling_point_C
            - density_g_mL_20C
            - viscosity_cP_25C
        validation:
          coverage: strict_non_absent
          collision: warn_if_rdkit_only_collision
          allow_semichemical_ordinal: false

    - name: concentration
      role: concentration
      type: continuous
      domain: [0.057, 0.153]
      unit: "M"
      description: "Continuous concentration range spanning the observed dataset values"

    - name: temperature
      role: temperature
      type: continuous
      domain: [90.0, 120.0]
      unit: "°C"
      description: "Continuous temperature range spanning the observed dataset values"

  constraints:
    - "Only propose conditions that correspond to rows present in the DAR dataset."

  dataset:
    csv_path: ../data/DAR.csv
    feature_columns:
      - base_SMILES
      - ligand_SMILES
      - solvent_SMILES
      - concentration
      - temperature
    target_column: yield
    row_id_column: ""

  initial_data: []

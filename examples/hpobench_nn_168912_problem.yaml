problem:
  application_domain: hpo
  domain_profile: ml_hyperparameter_optimization
  description: |
    Optimize HPOBench neural network test accuracy on OpenML task 168912.
    The optimization key uses the neural network hyperparameter grid plus iter fidelity.
    The CSV aggregates repeated seeds and keeps the constant subsample column as metadata.
  reaction_type: HPOBENCH_NN
  target_metric: test_acc
  optimization_direction: maximize
  budget: 40
  hpo_benchmark:
    source: HPOBench
    model: nn
    task_id: 168912
    dataset_name: openml_168912
    metric: test_acc
    hp_space: 5D + iter fidelity
    grid: "150000 configs"
    data_summary: "5-seed aggregated tabular benchmark"
    config_columns: [alpha, batch_size, depth, learning_rate_init, width]
    fidelity_columns: [iter]
  variables:
    - {name: alpha, role: hyperparameter, type: categorical, domain: [], description: "Neural network regularization strength grid level, log-scaled in the benchmark."}
    - {name: batch_size, role: hyperparameter, type: categorical, domain: [], description: "Neural network batch size grid level, log-scaled in the benchmark."}
    - {name: depth, role: hyperparameter, type: categorical, domain: [], description: "Neural network depth grid level."}
    - {name: learning_rate_init, role: hyperparameter, type: categorical, domain: [], description: "Neural network initial learning rate grid level, log-scaled in the benchmark."}
    - {name: width, role: hyperparameter, type: categorical, domain: [], description: "Neural network hidden width grid level."}
    - {name: iter, role: fidelity, type: categorical, domain: [], description: "Neural network training iteration fidelity grid level."}
  constraints:
    - "Only propose configurations that correspond to rows present in the HPOBench nn task 168912 dataset."
    - "Treat iter as part of the legal tabular configuration key."
  dataset:
    csv_path: ../data/HPOBench/hpobench_nn_168912.csv
    feature_columns: [alpha, batch_size, depth, learning_rate_init, width, iter]
    target_column: test_acc
    row_id_column: row_id
  initial_data: []

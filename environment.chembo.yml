name: chembo
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26,<2
  - pandas>=2.2
  - scipy>=1.12
  - scikit-learn>=1.4
  - pyyaml>=6.0
  - pydantic>=2.6
  - rich>=13.7
  - pytest>=8.0
  - requests>=2.31
  - rdkit
  - pip:
      - langgraph>=0.3.0
      - langchain-core>=0.3.0
      - langchain-openai>=0.2.0
      - openai>=1.30.0
      - torch>=2.10,<2.11
      - gpytorch>=1.15,<1.16
      - botorch>=0.17,<0.18
      - catboost>=1.2
      # Optional retrieval / local RAG extras. Not required for the benchmark
      # experiment scripts and can be installed later if needed.
      # - langchain-anthropic>=0.3.0
      # - chromadb>=0.5.0
      # - sentence-transformers>=3.0.0
      # - pymupdf>=1.24.0
      # - rank-bm25>=0.2.2
      # - tavily-python>=0.5.0

llm_model: "kimi-k2.5"
llm_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
llm_api_key_env: "DASHSCOPE_API_KEY"
llm_enable_thinking: true
llm_temperature: 0.3
llm_max_tokens: 4096
warm_start_llm_max_tokens: 8192

batch_size: 1
max_bo_iterations: 40
initial_doe_size: 10
shortlist_top_k: 5
autobo_enabled: true
llm_warm_start_then_autobo_ablation_enabled: true
pure_reasoning_ablation_enabled: false
zero_llm_ablation_enabled: false

knowledge_enabled: true
prior_writer_enabled: true
warm_start_per_point_llm_interpret: false

ensemble_af: false
autobo_llm_acq_enabled: false
autobo_llm_plaus_enabled: false
autobo_af_strategy_enabled: false

reflect_interval: 10
convergence_patience: 5
convergence_threshold: 0.01

human_input_mode: "dataset_auto"

autobo_loocv_max_workers: 4
bo_torch_device: "cuda:5"
bo_torch_devices:
  - "cuda:5"
  - "cuda:4"
  - "cuda:3"
  - "cuda:2"
